services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pizza_vitti}
      POSTGRES_USER: ${POSTGRES_USER:-pizza_vitti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pizza_vitti_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pizza-vitti-ovh:latest
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py ensure_admin &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env.ovh
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pizza_vitti}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pizza_vitti}
      PORT: "8000"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - pizza_vitti_media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pizza_vitti_postgres:
  pizza_vitti_media:
