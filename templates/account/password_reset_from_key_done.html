{% extends "shop/base.html" %}
{% load static %}
{% block content %}
<section class="auth-page">
  <div class="auth-shell single">
    <div class="auth-card-vitti auth-reset-status">
      <img src="{% static 'shop/img/logo-vitti-clean.png' %}" alt="Pizza Vitti" class="auth-logo small">
      <span class="auth-status-icon success" aria-hidden="true">✓</span>
      <h2>Mot de passe modifié</h2>
      <p class="auth-subtitle">Votre compte et votre progression fidélité sont de nouveau accessibles.</p>
      <a class="auth-submit" href="{% url 'account_login' %}">Me connecter</a>
    </div>
  </div>
</section>
{% endblock %}
